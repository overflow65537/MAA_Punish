name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false

jobs:
  mirrorchyan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [win, linux, macos]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('MPA-{0}-{1}-*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: MAA_Punish
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: overflow65537
          repo: MAA_Punish
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
