# MaaFwApp 的 Project Interface 打包配方。
# 所有相对路径均以本文件所在目录（.github/android）为基准。
assets: ../..

# 写了 include 就完全以配方为准（不会回落 MaaFwApp 的默认列表），所以 interface.json
# 里 import 的分片目录必须逐个列进来：桌面端的 tools/ci/install.py 是整目录复制，
# 这里漏一个目录，Android 上就会把整片 option/setting 静默跳过。
include:
  - interface.json
  - tasks/**
  - options/**
  - resource/**
  - i18n/**
  - agent/**
  - logo.png
  - LICENSE

# Android 只使用 interface.json 中 type: Adb 的控制器；以下为桌面端专用资源。
exclude:
  - resource/pgr_win32/**
  - resource/playcover/**
  - agent/tests/**
  - agent/test_support/**
  - agent/debug/**
  - agent/.pytest_cache/**
  - agent/**/__pycache__/**
  - agent/pytest.ini
  - agent/**/.gitignore

agent:
  sourceDir: ../../build-android/agent-dist
  abi:
    - arm64-v8a
    - x86_64
  runtimes:
    - location: bundle
      executable: bin/python3
      args:
        - -u
        - agent/main.py
      env:
        PYTHONHOME: "{bundle}/prefix"
        PYTHONPATH: "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
        LD_LIBRARY_PATH: "{bundle}/prefix/lib:{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"

# 压过 interface.json 里的桌面端 mirrorchyan_rid，应用内更新走 Android APK 渠道。
update:
  mirrorchyanRid: MAA_Punish_MaaFwApp

app:
  id: punish
  label: MAA Punish
  icon: ../../logo.png
