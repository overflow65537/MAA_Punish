# MaaFwApp 的 Project Interface 打包配方。
# 所有相对路径均以本文件所在目录（.github/android）为基准。
assets: ../..

include:
  - interface.json
  - tasks/**
  - resource/**
  - i18n/**
  - agent/**
  - logo.png
  - LICENSE

# Android 只使用 interface.json 中 type: Adb 的控制器；以下为桌面端专用资源。
exclude:
  - resource/pgr_win32/**
  - resource/playcover/**
  - agent/tests/**
  - agent/test_support/**
  - agent/debug/**
  - agent/.pytest_cache/**
  - agent/**/__pycache__/**
  - agent/pytest.ini
  - agent/**/.gitignore

agent:
  sourceDir: ../../build-android/agent-dist
  abi:
    - arm64-v8a
    - x86_64
  runtimes:
    - location: bundle
      executable: bin/python3
      args:
        - -u
        - agent/main.py
      env:
        PYTHONHOME: "{bundle}/prefix"
        PYTHONPATH: "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
        LD_LIBRARY_PATH: "{bundle}/prefix/lib:{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"

app:
  id: punish
  label: MAA Punish
  icon: ../../logo.png
